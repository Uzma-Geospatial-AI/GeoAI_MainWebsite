name: Deploy site to GitHub Pages

# Publishes the redesigned site (redesign/) to GitHub Pages on every push to main.
# The site is plain static HTML/CSS/JS with relative asset paths, so it works
# correctly whether it is served from a user site or a /<repo>/ project subpath.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify every asset referenced by the redesign exists
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const root = 'redesign';
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="([^"]+)"/g)].map(m => m[1]);
          let missing = [];
          for (const ref of refs) {
            if (/^(https?:|data:|mailto:|tel:|#|javascript:)/.test(ref)) continue;
            const clean = decodeURIComponent(ref.split('#')[0].split('?')[0]);
            if (!clean) continue;
            if (!fs.existsSync(path.join(root, clean))) missing.push(clean);
          }
          console.log(`Checked ${refs.length} references in redesign/index.html`);
          if (missing.length) {
            console.error('Missing assets:\n  ' + missing.join('\n  '));
            process.exit(1);
          }
          console.log('All local assets resolve.');
          EOF

  deploy:
    name: Build and deploy
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload redesign/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: redesign

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
